<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Matic Votes{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-[#0F0F1A] text-slate-100 font-sans antialiased min-h-screen">
    <div class="flex h-screen overflow-hidden">
        <aside class="hidden md:flex md:flex-shrink-0">
            <div class="flex flex-col w-64 bg-[#1A1A2E] border-r border-[#2A2A45] min-h-screen">
                <div class="p-6 border-b border-[#2A2A45]">
                    <span class="text-xl font-bold bg-gradient-to-r from-violet-400 to-blue-400 bg-clip-text text-transparent">
                        Matic Votes
                    </span>
                </div>

                <nav class="flex-1 px-2 py-4 space-y-1 overflow-y-auto">
                    <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'dashboard' %}bg-gradient-to-r from-violet-600/20 to-blue-600/20 border border-violet-500/30 text-violet-300{% else %}text-slate-400 hover:text-slate-200 hover:bg-white/5{% endif %}">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                        </svg>
                        Dashboard
                    </a>

                    <a href="{% url 'organization_list' %}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'organization_list' or request.resolver_match.url_name == 'organization_create' or request.resolver_match.url_name == 'organization_detail' or request.resolver_match.url_name == 'organization_update' %}bg-gradient-to-r from-violet-600/20 to-blue-600/20 border border-violet-500/30 text-violet-300{% else %}text-slate-400 hover:text-slate-200 hover:bg-white/5{% endif %}">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                        Organizações
                    </a>

                    <a href="{% url 'organization_list' %}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'member_list' or request.resolver_match.url_name == 'member_create' or request.resolver_match.url_name == 'member_update' %}bg-gradient-to-r from-violet-600/20 to-blue-600/20 border border-violet-500/30 text-violet-300{% else %}text-slate-400 hover:text-slate-200 hover:bg-white/5{% endif %}">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                        Membros
                    </a>

                    <a href="{% url 'assembly_list' %}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'assembly_list' or request.resolver_match.url_name == 'assembly_create' or request.resolver_match.url_name == 'assembly_detail' or request.resolver_match.url_name == 'assembly_update' %}bg-gradient-to-r from-violet-600/20 to-blue-600/20 border border-violet-500/30 text-violet-300{% else %}text-slate-400 hover:text-slate-200 hover:bg-white/5{% endif %}">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        Assembleias
                    </a>

                    <a href="{% url 'assembly_list' %}?status=closed" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'minutes_detail' or request.resolver_match.url_name == 'minutes_approve' or request.resolver_match.url_name == 'minutes_sign' %}bg-gradient-to-r from-violet-600/20 to-blue-600/20 border border-violet-500/30 text-violet-300{% else %}text-slate-400 hover:text-slate-200 hover:bg-white/5{% endif %}">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        Atas
                    </a>
                </nav>

                <div class="p-4 border-t border-[#2A2A45]">
                    <div class="flex items-center gap-3 px-3 py-2 rounded-lg bg-[#0F0F1A]/60">
                        <div class="flex-shrink-0 w-8 h-8 bg-gradient-to-br from-violet-500 to-blue-600 rounded-full flex items-center justify-center text-white font-bold text-sm">
                            {{ request.user.email.0|upper }}
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-medium text-slate-300 truncate">{{ request.user.email }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="flex flex-col flex-1 overflow-hidden">
            <header class="bg-[#1A1A2E] border-b border-[#2A2A45] shadow-lg">
                <div class="px-4 sm:px-6 lg:px-8">
                    <div class="flex items-center justify-between h-16">
                        <button class="md:hidden p-2 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-white/5 transition-colors">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </button>

                        <div class="flex-1 flex justify-center md:justify-start">
                            <h1 class="text-xl font-semibold text-slate-100">{% block page_title %}Dashboard{% endblock %}</h1>
                        </div>

                        <div class="flex items-center space-x-3">
                            <button class="p-2 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-white/5 transition-colors relative">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                                </svg>
                                <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 bg-red-500 rounded-full"></span>
                            </button>

                            <a href="{% url 'logout' %}" class="border border-[#2A2A45] hover:border-violet-500 text-slate-300 hover:text-white font-medium px-4 py-2 rounded-lg transition-all duration-200 hover:bg-violet-500/10 text-sm">
                                Sair
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto bg-[#0F0F1A]">
                <div class="px-4 sm:px-6 lg:px-8 py-8">
                    {% block content %}
                    {% endblock %}
                </div>
            </main>
        </div>
    </div>
</body>
</html>
