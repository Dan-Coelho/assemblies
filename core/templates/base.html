<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Matic Votes{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen text-gray-100">
    <div class="flex h-screen overflow-hidden">
        <aside class="hidden md:flex md:flex-shrink-0">
            <div class="flex flex-col w-64 bg-slate-900/80 backdrop-blur-sm border-r border-slate-700/50">
                <div class="flex items-center justify-center h-16 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 shadow-lg shadow-indigo-500/20">
                    <span class="text-2xl font-bold text-white">Matic Votes</span>
                </div>

                <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
                    <a href="{% url 'dashboard' %}" class="flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-all hover:bg-indigo-600/20 hover:text-indigo-400 {% if request.resolver_match.url_name == 'dashboard' %}bg-indigo-600/30 text-indigo-400{% else %}text-gray-300{% endif %}">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                        </svg>
                        Dashboard
                    </a>

                    <a href="#" class="flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-all hover:bg-indigo-600/20 hover:text-indigo-400 text-gray-300">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                        </svg>
                        Organizações
                    </a>

                    <a href="#" class="flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-all hover:bg-indigo-600/20 hover:text-indigo-400 text-gray-300">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        Membros
                    </a>

                    <a href="#" class="flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-all hover:bg-indigo-600/20 hover:text-indigo-400 text-gray-300">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        Assembleias
                    </a>

                    <a href="#" class="flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-all hover:bg-indigo-600/20 hover:text-indigo-400 text-gray-300">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        </svg>
                        Atas
                    </a>
                </nav>

                <div class="px-3 py-4 border-t border-slate-700/50">
                    <div class="flex items-center px-4 py-3 text-sm rounded-lg bg-slate-800/50">
                        <div class="flex-shrink-0 w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/20">
                            {{ request.user.email.0|upper }}
                        </div>
                        <div class="ml-3 flex-1 min-w-0">
                            <p class="text-xs font-medium text-gray-300 truncate">{{ request.user.email }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="flex flex-col flex-1 overflow-hidden">
            <header class="bg-slate-900/80 backdrop-blur-sm border-b border-slate-700/50 shadow-lg">
                <div class="px-4 sm:px-6 lg:px-8">
                    <div class="flex items-center justify-between h-16">
                        <button class="md:hidden p-2 rounded-lg text-gray-400 hover:text-gray-300 hover:bg-slate-800 transition-colors">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </button>

                        <div class="flex-1 flex justify-center md:justify-start">
                            <h1 class="text-xl font-semibold text-gray-100">{% block page_title %}Dashboard{% endblock %}</h1>
                        </div>

                        <div class="flex items-center space-x-4">
                            <button class="p-2 rounded-lg text-gray-400 hover:text-gray-300 hover:bg-slate-800 transition-colors relative">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                                </svg>
                                <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                            </button>

                            <a href="{% url 'logout' %}" class="px-4 py-2 text-sm font-medium text-gray-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition-all border border-slate-700 hover:border-slate-600">
                                Sair
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
                <div class="px-4 sm:px-6 lg:px-8 py-8">
                    {% block content %}
                    {% endblock %}
                </div>
            </main>
        </div>
    </div>
</body>
</html>
