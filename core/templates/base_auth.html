<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Matic Votes{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-[#0F0F1A] min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-violet-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-violet-400 to-blue-400 bg-clip-text text-transparent mb-2">
                Matic Votes
            </h1>
            <p class="text-slate-400 text-sm">{% block subtitle %}Sistema de Gestão de Assembleias{% endblock %}</p>
        </div>

        <div class="bg-[#1A1A2E] border border-[#2A2A45] rounded-2xl shadow-2xl p-8">
            {% block content %}
            {% endblock %}
        </div>

        <div class="mt-6 text-center">
            <p class="text-sm text-slate-400">
                {% block footer_text %}
                    Já tem uma conta? <a href="{% url 'login' %}" class="text-violet-400 hover:text-violet-300 font-medium transition-colors">Fazer login</a>
                {% endblock %}
            </p>
        </div>
    </div>
</body>
</html>
